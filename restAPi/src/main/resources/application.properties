spring.application.name=restAPi
server.address=0.0.0.0


spring.config.import=optional:file:.env[.properties]

# Inference stays on the local machine or the private Compose network.
local.ai.url=${LOCAL_AI_URL:http://localhost:8081}
local.ai.timeout-seconds=${LOCAL_AI_TIMEOUT_SECONDS:60}

# Empty disables the optional local decision model outside the root Docker stack.
local.decision.url=${LOCAL_DECISION_URL:}
local.decision.timeout-seconds=${LOCAL_DECISION_TIMEOUT_SECONDS:8}
